name: Release

on:
  push:
    tags:
      - "v*"   # triggers on v0.1.0, v1.2.3, etc.

jobs:
  # ── 1. Publish to PyPI ──────────────────────────────────────────────────
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$TOML" ]; then
            echo "ERROR: tag $TAG does not match pyproject.toml version $TOML"
            exit 1
          fi

      - name: Install build tools
        run: pip install hatch

      - name: Build wheel and sdist
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 2. Build macOS binaries (arm64 + x86_64) ───────────────────────────
  macos-binary:
    name: Build macOS binary (${{ matrix.arch }})
    needs: pypi
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - arch: arm64
            runs-on: macos-14       # Apple Silicon runner
          - arch: linux-x86_64
            runs-on: ubuntu-latest
          - arch: linux-aarch64
            runs-on: ubuntu-24.04-arm  # GitHub's native ARM64 Linux runner

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography i2cdriver pyinstaller

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name eeprom-sign-macos-${{ matrix.arch }} \
            --strip \
            src/eeprom_sign/__init__.py

      - name: Smoke test
        run: ./dist/eeprom-sign-macos-${{ matrix.arch }} --help

      - name: Compute SHA-256
        run: |
          shasum -a 256 dist/eeprom-sign-macos-${{ matrix.arch }} \
            | tee dist/eeprom-sign-macos-${{ matrix.arch }}.sha256

      - name: Upload binary as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eeprom-sign-macos-${{ matrix.arch }}
            dist/eeprom-sign-macos-${{ matrix.arch }}.sha256

  # ── 3. Notify homebrew-tap once both binaries are uploaded ─────────────
  notify-tap:
    name: Notify homebrew-tap
    needs: macos-binary
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to homebrew-tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: fred-corp/homebrew-tap
          event-type: new-release
          client-payload: |
            {
              "tool": "eeprom-sign",
              "version": "${{ github.ref_name }}",
              "owner": "${{ github.repository_owner }}"
            }